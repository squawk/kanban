# Wakes the app once a day and sends due-date reminder emails.
# The app also checks hourly while it's running; this covers machines that
# Fly has stopped for being idle. Sends are idempotent, so overlap is harmless.
#
# Setup: add repository secrets KANBAN_URL (e.g. https://kanban-purple.fly.dev)
# and CRON_SECRET (same value as the app's CRON_SECRET env var).
name: Due-date reminders
on:
  schedule:
    - cron: "17 16 * * *" # 16:17 UTC daily (8–9am Pacific)
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        env:
          KANBAN_URL: ${{ secrets.KANBAN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KANBAN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "KANBAN_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$KANBAN_URL/api/cron/due-reminders"
